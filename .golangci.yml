# Preserve the enabled v1.61.0 policy explicitly across the v2 upgrade.
# Removed deprecated scopelint/nosnakecase exclusions had no active checks;
# Successor linters inherit the original exclusions and settings.
version: "2"
run:
  timeout: 1m
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forbidigo
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - importas
    - inamedparam
    - ineffassign
    - intrange
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - testableexamples
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wsl_v5
    - zerologlint
  settings:
    # tenv only checked os.Setenv; preserve that scope via its successor.
    usetesting:
      os-setenv: true
      os-create-temp: false
      os-mkdir-temp: false
      os-chdir: false
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
    funlen:
      lines: 150
      statements: 45
    # es/ keeps its development-only replacement to this repo root.
    gomoddirectives:
      replace-local: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - forbidigo
          - gochecknoinits
          - mnd
        path: cmd/
      - linters:
          - gosec
        path: message/util.go
      - linters:
          - lll
        path: example_test.go
      - linters:
          - nlreturn
          - unparam
        path: internal/http/
      - linters:
          - dupl
          - dupword
          - funlen
          - nlreturn
          - wsl_v5
        path: _test\.go
      - linters:
          - lll
        path: doc.go
      - linters:
          - testableexamples
        path: example_test.go
      - linters:
          - lll
        source: 'json:'
      - linters:
          - gocritic
          - godot
        source: //////
    paths:
      - internal/*
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - internal/*
      - third_party$
      - builtin$
      - examples$

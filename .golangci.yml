# Migrated to golangci-lint v2 with the upstream migrate command.
# Removed deprecated scopelint/nosnakecase exclusions had no active checks;
# Existing active wsl test exclusions remain unchanged.
version: "2"
run:
  timeout: 1m
linters:
  default: all
  disable:
    - copyloopvar
    - cyclop
    - depguard
    - err113
    - exhaustruct
    - forcetypeassert
    - gochecknoglobals
    - godox
    - interfacebloat
    - ireturn
    - paralleltest
    - perfsprint
    - revive
    - tagliatelle
    - testpackage
    - varnamelen
    - wrapcheck
  settings:
    funlen:
      lines: 150
      statements: 45
    # es/ keeps its development-only replacement to this repo root.
    gomoddirectives:
      replace-local: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - forbidigo
          - gochecknoinits
          - mnd
        path: cmd/
      - linters:
          - gosec
        path: message/util.go
      - linters:
          - lll
        path: example_test.go
      - linters:
          - nlreturn
          - unparam
        path: internal/http/
      - linters:
          - dupl
          - dupword
          - funlen
          - nlreturn
          - wsl
        path: _test\.go
      - linters:
          - lll
        path: doc.go
      - linters:
          - testableexamples
        path: example_test.go
      - linters:
          - lll
        source: 'json:'
      - linters:
          - gocritic
          - godot
        source: //////
    paths:
      - internal/*
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - internal/*
      - third_party$
      - builtin$
      - examples$
